<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 기반 데이터 저널리스트 양성 과정 — 주차별 퀴즈</title>
<style>
  :root {
    --navy: #1E2761;
    --navy-light: #2E3A8C;
    --red: #E63946;
    --ice: #CADCFC;
    --bg: #F4F6FB;
    --gray: #5C6070;
    --green: #1E8449;
    --green-bg: #E9F7EF;
    --red-bg: #FDEDEE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #FFFFFF;
    color: #1A1A2E;
    line-height: 1.6;
  }
  header {
    background: var(--navy);
    color: white;
    padding: 32px 24px 26px;
  }
  header .eyebrow {
    color: var(--ice);
    font-size: 13px;
    margin-bottom: 6px;
  }
  header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
  }
  .tabs {
    display: flex;
    max-width: 760px;
    margin: -18px auto 0;
    padding: 0 24px;
    gap: 8px;
    position: relative;
    z-index: 2;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 14px 10px;
    background: white;
    border: 1px solid #E1E4EC;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    font-weight: 700;
    font-size: 15px;
    color: var(--gray);
    box-shadow: 0 2px 8px rgba(30,39,97,0.08);
  }
  .tab.active {
    color: var(--navy);
    border-bottom: 3px solid var(--red);
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 24px 60px;
  }
  .week-panel { display: none; }
  .week-panel.active { display: block; }
  .score-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 24px;
    font-size: 14px;
  }
  .score-bar .label { color: var(--gray); }
  .score-bar .score { font-weight: 700; color: var(--navy); font-size: 16px; }
  .reset-btn {
    background: none;
    border: 1px solid #C9CEDB;
    color: var(--gray);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .reset-btn:hover { background: white; }
  .q-card {
    border: 1px solid #E1E4EC;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
  }
  .q-num {
    color: var(--red);
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .q-prompt {
    font-size: 16px;
    font-weight: 700;
    color: var(--navy);
    margin: 0 0 14px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .option {
    text-align: left;
    padding: 11px 14px;
    border: 1px solid #DADFEA;
    border-radius: 8px;
    background: white;
    font-size: 14.5px;
    cursor: pointer;
    color: #1A1A2E;
  }
  .option:hover { border-color: var(--navy-light); }
  .option.correct {
    background: var(--green-bg);
    border-color: var(--green);
    color: var(--green);
    font-weight: 700;
  }
  .option.incorrect {
    background: var(--red-bg);
    border-color: var(--red);
    color: var(--red);
    font-weight: 700;
  }
  .option.disabled { cursor: default; }
  .feedback {
    display: none;
    margin-top: 12px;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--bg);
    font-size: 13.5px;
    color: #333;
  }
  .feedback.show { display: block; }
  .feedback .verdict {
    font-weight: 700;
    margin-bottom: 4px;
  }
  .feedback .verdict.ok { color: var(--green); }
  .feedback .verdict.no { color: var(--red); }
  .hint-btn {
    background: none;
    border: none;
    color: var(--gray);
    font-size: 12.5px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
    margin-top: 10px;
  }
  .hint-text {
    display: none;
    font-size: 12.5px;
    color: var(--gray);
    font-style: italic;
    margin-top: 6px;
  }
  .hint-text.show { display: block; }
  footer {
    text-align: center;
    color: var(--gray);
    font-size: 12px;
    padding: 20px 24px 40px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">[MBC 미디어캠퍼스] AI 기반 데이터 저널리스트 양성 과정</div>
  <h1>주차별 확인 퀴즈</h1>
</header>

<div class="tabs">
  <div class="tab active" data-week="1">1주차</div>
  <div class="tab" data-week="2">2주차</div>
  <div class="tab" data-week="3">3주차</div>
  <div class="tab" data-week="4">4주차</div>
</div>

<main>
  <div class="week-panel active" id="week-1">
    <div class="score-bar">
      <span class="label">가짜뉴스·허위콘텐츠 구별 실습 · 5문항</span>
      <span><span class="score" id="score-1">0 / 5</span></span>
      <button class="reset-btn" onclick="resetWeek(1)">다시 풀기</button>
    </div>
    <div id="quiz-1"></div>
  </div>

  <div class="week-panel" id="week-2">
    <div class="score-bar">
      <span class="label">도메인 확장·로봇저널리즘·AI 기사생성 · 5문항</span>
      <span><span class="score" id="score-2">0 / 5</span></span>
      <button class="reset-btn" onclick="resetWeek(2)">다시 풀기</button>
    </div>
    <div id="quiz-2"></div>
  </div>

  <div class="week-panel" id="week-3">
    <div class="score-bar">
      <span class="label">데이터 수집(IMPORTXML)과 정제(AI 챗봇) · 5문항</span>
      <span><span class="score" id="score-3">0 / 5</span></span>
      <button class="reset-btn" onclick="resetWeek(3)">다시 풀기</button>
    </div>
    <div id="quiz-3"></div>
  </div>

  <div class="week-panel" id="week-4">
    <div class="score-bar">
      <span class="label">파인튜닝과 AI 생성물 검수 · 5문항</span>
      <span><span class="score" id="score-4">0 / 5</span></span>
      <button class="reset-btn" onclick="resetWeek(4)">다시 풀기</button>
    </div>
    <div id="quiz-4"></div>
  </div>
</main>

<footer>AI 기반 데이터 저널리스트 양성 과정 · 강의 보조 자료</footer>

var state = { 1: { answered: {}, correct: 0 }, 2: { answered: {}, correct: 0 }, 3: { answered: {}, correct: 0 }, 4: { answered: {}, correct: 0 } };

function renderWeek(week) {
  var container = document.getElementById("quiz-" + week);
  container.innerHTML = "";
  var qs = quizzes[week];
  for (var qi = 0; qi < qs.length; qi++) {
    (function (qi) {
      var q = qs[qi];
      var card = document.createElement("div");
      card.className = "q-card";

      var num = document.createElement("div");
      num.className = "q-num";
      num.textContent = "문제 " + (qi + 1);
      card.appendChild(num);

      var prompt = document.createElement("p");
      prompt.className = "q-prompt";
      prompt.textContent = q.prompt;
      card.appendChild(prompt);

      var optWrap = document.createElement("div");
      optWrap.className = "options";
      for (var oi = 0; oi < q.options.length; oi++) {
        (function (oi) {
          var btn = document.createElement("button");
          btn.className = "option";
          btn.textContent = q.options[oi];
          btn.onclick = function () { selectAnswer(week, qi, oi, card); };
          optWrap.appendChild(btn);
        })(oi);
      }
      card.appendChild(optWrap);

      var hintBtn = document.createElement("button");
      hintBtn.className = "hint-btn";
      hintBtn.textContent = "힌트 보기";
      var hintText = document.createElement("div");
      hintText.className = "hint-text";
      hintText.textContent = q.hint;
      hintBtn.onclick = function () {
        if (hintText.className.indexOf("show") === -1) {
          hintText.className = "hint-text show";
        } else {
          hintText.className = "hint-text";
        }
      };
      card.appendChild(hintBtn);
      card.appendChild(hintText);

      var feedback = document.createElement("div");
      feedback.className = "feedback";
      feedback.id = "fb-" + week + "-" + qi;
      card.appendChild(feedback);

      container.appendChild(card);
    })(qi);
  }
}

function selectAnswer(week, qi, oi, card) {
  if (state[week].answered[qi] !== undefined) return;
  state[week].answered[qi] = oi;
  var q = quizzes[week][qi];
  var buttons = card.querySelectorAll(".option");
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].className = "option disabled";
    if (i === q.correct) buttons[i].className = "option disabled correct";
    else if (i === oi) buttons[i].className = "option disabled incorrect";
  }
  var fb = card.querySelector(".feedback");
  var isCorrect = oi === q.correct;
  if (isCorrect) state[week].correct++;
  fb.innerHTML =
    '<div class="verdict ' + (isCorrect ? "ok" : "no") + '">' +
    (isCorrect ? "정답입니다!" : "아쉬워요, 다시 확인해보세요.") +
    "</div>" + q.explanation;
  fb.className = "feedback show";
  updateScore(week);
}

function updateScore(week) {
  document.getElementById("score-" + week).textContent = state[week].correct + " / " + quizzes[week].length;
}

function resetWeek(week) {
  state[week] = { answered: {}, correct: 0 };
  updateScore(week);
  renderWeek(week);
}

var tabs = document.querySelectorAll(".tab");
for (var t = 0; t < tabs.length; t++) {
  tabs[t].onclick = function () {
    var wk = this.getAttribute("data-week");
    var allTabs = document.querySelectorAll(".tab");
    for (var i = 0; i < allTabs.length; i++) allTabs[i].className = "tab";
    var allPanels = document.querySelectorAll(".week-panel");
    for (var j = 0; j < allPanels.length; j++) allPanels[j].className = "week-panel";
    this.className = "tab active";
    document.getElementById("week-" + wk).className = "week-panel active";
  };
}

renderWeek(1);
renderWeek(2);
renderWeek(3);
renderWeek(4);
</script>
